name: internship-alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # runs every 10 minutes
  workflow_dispatch:          # manual trigger from Actions tab

permissions:
  contents: write             # needed to save seen_jobs.db back to the repo

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new internships
        run: python internship_alerts.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save seen jobs
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          if [ -f seen_jobs.db ]; then
            git add seen_jobs.db
            git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
          fi
